[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hike2gpx"
description = "Tracé de randonnée sur fond IGN qui respecte les clôtures, barrières et interdictions d'OpenStreetMap"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "nico579-commons>=0.5.1,<0.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hike2gpx = "hike2gpx.__main__:main"

[tool.setuptools]
packages = ["hike2gpx", "hike2gpx.assets", "hike2gpx.assets.web"]

[tool.setuptools.package-data]
"hike2gpx.assets.web" = ["*.html", "*.js", "*.css", "leaflet/*"]

[tool.setuptools.dynamic]
version = {attr = "hike2gpx.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
