# Le serveur des lots, sur GitHub Actions : fabrique les lots hors ligne des
# cases demandées et les publie, avec leur catalogue, sur la publication fixe
# « bundles » du dépôt appelant (nico579/hike2gpx-bundles), dont l'adresse ne
# change jamais (depot.DEPOT). Workflow réutilisable : le dépôt des lots ne
# garde qu'un petit appel planifié, toute la logique vit ici, à côté du code.
#
# Essai du 2026-10-27 : une case entière (E5_N40) en 87 min, 6,1 Go de mémoire
# au plus, 35 Go de disque ; une tâche par case, en parallèle.
name: Lots hors ligne

on:
  workflow_call:
    inputs:
      cases:
        description: Cases BRouter à fabriquer, séparées par des espaces ; vide, toutes celles
          que touchent les pays des fournisseurs lisibles en bloc (hike2gpx cells --bulk-only)
        type: string
        default: ""
      ref:
        description: Version de hike2gpx qui fabrique
        type: string
        default: main
  # Essai depuis ce dépôt, sur une branche, avant de toucher au serveur : la
  # même fabrication, mais rien n'est publié (voir PUBLIER).
  workflow_dispatch:
    inputs:
      cases:
        description: Cases BRouter à fabriquer, séparées par des espaces
        type: string
        default: E0_N45
      ref:
        description: Version de hike2gpx qui fabrique
        type: string
        default: main

permissions:
  contents: write                   # publier sur le dépôt appelant

jobs:
  liste:
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    env:
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
    steps:
      - name: Checkout hike2gpx
        if: inputs.cases == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        if: inputs.cases == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        if: inputs.cases == ''
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - id: cases
        env:
          CASES: ${{ inputs.cases }}
        run: |
          # Sans liste donnée, les cases se déduisent des contours des pays : un
          # fournisseur qui gagne une lecture en bloc entre de lui-même au serveur.
          if [ -z "$CASES" ]; then CASES=$(python -m hike2gpx cells --bulk-only); fi
          echo "cases : $CASES"
          echo "cases=$(jq -cn --arg c "$CASES" '$c | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  bdtopo:
    # Les tronçons BD TOPO de toutes les régions françaises des cases, préparés
    # une fois et gardés par actions/cache : l'IGN ne publie une édition que
    # quatre fois par an, inutile de retélécharger chaque semaine ses archives
    # régionales (11 Go de 7z pour les cinq régions de W5_N45). Une seule entrée
    # pour toutes les cases, et non une par case : une région touche jusqu'à
    # quatre cases, et ces 35 copies (une dizaine de Go compressés) rempliraient
    # à elles seules les 10 Go de cache d'un dépôt.
    needs: liste
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cle: ${{ steps.editions.outputs.cle }}
    env:
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
      CASES: ${{ join(fromJSON(needs.liste.outputs.cases), ' ') }}
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - id: editions
        run: |
          # Les régions que touchent les cases et leur dernière édition
          # (« R53.2026-09-15_R75.2026-06-15… ») : la clé du cache, qui ne change
          # qu'avec une édition nouvelle. Vide hors de France, ou si le catalogue
          # de l'IGN ne répond pas : chaque case lira alors ses régions elle-même.
          EDITIONS=$(python -c "import sys; from hike2gpx import bdtopo_regions, lot; l = bdtopo_regions.Lecteur(None); r = sorted({x for c in sys.argv[1:] for x in l.regions(*lot.boite_case(c))}); print('_'.join(x + '.' + l.edition(x)['date'] for x in r))" $CASES) || EDITIONS=""
          echo "éditions : ${EDITIONS:-aucune}"
          # « v2 » : le format des bases réduites (bdtopo_regions._garder_les_troncons),
          # fid clé primaire depuis la PR #57. À changer avec lui, sans quoi le
          # cache rendrait l'ancien format.
          if [ -n "$EDITIONS" ]; then
            echo "editions=$EDITIONS" >> "$GITHUB_OUTPUT"; echo "cle=bdtopo-v2-$EDITIONS" >> "$GITHUB_OUTPUT"
          fi

      - name: Reprendre les tronçons BD TOPO
        id: cache
        if: steps.editions.outputs.cle != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # runner.workspace est le parent de github.workspace : c'est
          # HIKE2GPX_HOME écrit sans « .. », que actions/cache refuse. À défaut
          # de clé exacte, la dernière gardée rend les régions inchangées.
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ steps.editions.outputs.cle }}
          restore-keys: bdtopo-v2-

      - name: Télécharger les régions nouvelles
        if: steps.editions.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          EDITIONS: ${{ steps.editions.outputs.editions }}
        run: |
          # Une région déjà là à la bonne édition n'est pas retéléchargée ;
          # les éditions plus anciennes sont effacées (bdtopo_regions.geopackage).
          time python -c "import logging, sys; logging.basicConfig(level=logging.INFO); from hike2gpx import bdtopo_regions; [bdtopo_regions.geopackage(sys.argv[1], e.split('.')[0]) for e in sys.argv[2].split('_')]" "$HIKE2GPX_HOME" "$EDITIONS"
          du -sh "$HIKE2GPX_HOME/bdtopo-regions"; ls -la "$HIKE2GPX_HOME/bdtopo-regions"

      - name: Garder les tronçons BD TOPO
        if: steps.editions.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ steps.editions.outputs.cle }}

  zabaged:
    # Jumelle de « bdtopo » pour la Tchéquie : le GeoPackage national de ZABAGED
    # (6,7 Go, vers 1 Mo/s depuis GitHub Actions, près de deux heures), réduit
    # aux sentiers et chemins, préparé une fois par édition et gardé par
    # actions/cache. Sans elle, chacune des quatre cases tchèques le
    # retéléchargerait chaque dimanche.
    needs: liste
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      cle: ${{ steps.edition.outputs.cle }}
    env:
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
      CASES: ${{ join(fromJSON(needs.liste.outputs.cases), ' ') }}
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - id: edition
        run: |
          # L'édition courante (« ZABAGED-3045-gpkg-20261004 ») si une case touche
          # la Tchéquie : la clé du cache. Vide sinon, ou si le flux de l'ČÚZK ne
          # répond pas : chaque case tchèque lira alors ZABAGED elle-même.
          EDITION=$(python -c "import sys; from hike2gpx import fabrication, lot, zabaged_national as z; print(z.derniere_edition()['nom'] if any('zabaged' in fabrication.fournisseurs_de_zone(sys.argv[1], lot.boite_case(c)) for c in sys.argv[2:]) else '')" "$HIKE2GPX_HOME" $CASES) || EDITION=""
          echo "édition : ${EDITION:-aucune}"
          # « v1 » : le format de la base réduite (zabaged_national._garder_les_chemins).
          if [ -n "$EDITION" ]; then echo "cle=zabaged-v1-$EDITION" >> "$GITHUB_OUTPUT"; fi

      - name: Reprendre les chemins ZABAGED
        id: cache
        if: steps.edition.outputs.cle != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Clé exacte seulement : une base d'une autre édition ne servirait pas.
          path: ${{ runner.workspace }}/donnees/zabaged-national
          key: ${{ steps.edition.outputs.cle }}

      - name: Télécharger l'édition
        if: steps.edition.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          time python -c "import logging, sys; logging.basicConfig(level=logging.INFO); from hike2gpx import zabaged_national; print(zabaged_national.geopackage(sys.argv[1]))" "$HIKE2GPX_HOME"
          du -sh "$HIKE2GPX_HOME/zabaged-national"; ls -la "$HIKE2GPX_HOME/zabaged-national"

      - name: Garder les chemins ZABAGED
        if: steps.edition.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/zabaged-national
          key: ${{ steps.edition.outputs.cle }}

  # Première moitié d'une case : ses téléchargements (extraits Geofabrik,
  # archives BD TOPO), près de deux heures pour E0_N45, passés à la tâche
  # « case » par un artefact. Chaque moitié a ses 6 heures, et une coupure du
  # calcul se relance seule (« Re-run failed jobs ») sans tout retélécharger.
  donnees:
    needs: [liste, bdtopo, zabaged]
    # Sans la préparation BD TOPO ou ZABAGED (échouée), chaque case lit ses
    # données elle-même.
    if: ${{ !cancelled() && needs.liste.result == 'success' }}
    name: données ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      # Six cases à la fois au plus : toutes ensemble, elles tiraient des dizaines
      # d'extraits en même temps chez Geofabrik, qui répondait 502/503 (2026-11-11).
      max-parallel: 6
      matrix:
        case: ${{ fromJSON(needs.liste.outputs.cases) }}
    env:
      CASE: ${{ matrix.case }}
      GH_TOKEN: ${{ github.token }}
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Reprendre le lot publié
        run: |
          # Un lot à jour n'a besoin d'aucune donnée : rien n'est téléchargé.
          mkdir -p "$RUNNER_TEMP/publie" "$RUNNER_TEMP/lots/$CASE"
          gh release download bundles --repo "$GITHUB_REPOSITORY" --pattern "$CASE.*" \
              --dir "$RUNNER_TEMP/publie" || true
          for f in "$RUNNER_TEMP"/publie/"$CASE".*; do
            [ -e "$f" ] || continue        # aucun fichier : le motif reste tel quel
            mv "$f" "$RUNNER_TEMP/lots/$CASE/${f##*/$CASE.}"
          done

      - name: Reprendre les tronçons BD TOPO
        if: needs.bdtopo.outputs.cle != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ needs.bdtopo.outputs.cle }}

      - id: tcheque
        if: needs.zabaged.outputs.cle != ''
        run: |
          # Seules les cases qui touchent la Tchéquie emportent ZABAGED dans leur artefact.
          python -c "import sys; from hike2gpx import fabrication, lot; print('oui=' + str('zabaged' in fabrication.fournisseurs_de_zone(sys.argv[1], lot.boite_case(sys.argv[2]))).lower())" "$HIKE2GPX_HOME" "$CASE" >> "$GITHUB_OUTPUT"

      - name: Reprendre les chemins ZABAGED
        if: steps.tcheque.outputs.oui == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/zabaged-national
          key: ${{ needs.zabaged.outputs.cle }}

      - name: Télécharger les données de la case
        # Trois passages : une panne passagère ne perd plus la case (.github/reessayer.sh).
        run: bash .github/reessayer.sh 3 python -m hike2gpx bundles "$CASE" --bulk --stage data --output "$RUNNER_TEMP/lots"

      - name: Ne garder que les régions de la case
        run: |
          # Le cache rend toutes les régions françaises des cases : l'artefact
          # de la case n'emporte que les siennes. Le service de l'IGN muet, il
          # les emporte toutes, rien de pire.
          python -c "import sys, pathlib; from hike2gpx import bdtopo_regions, lot; garder = set(bdtopo_regions.regions_de_zone(*lot.boite_case(sys.argv[2]))); [p.unlink() for p in pathlib.Path(sys.argv[1], 'bdtopo-regions').glob('*.troncons.sqlite') if not any(f'_{r}_' in p.name for r in garder)]" "$HIKE2GPX_HOME" "$CASE" \
            || echo "régions de la case inconnues : toutes gardées"

      - name: Taille des données
        run: |
          mkdir -p "$HIKE2GPX_HOME"
          du -sh "$HIKE2GPX_HOME"/* 2>/dev/null || true
          du -sh "$HIKE2GPX_HOME"; df -h "$HIKE2GPX_HOME"

      - name: Garder les données pour la case
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: donnees-${{ matrix.case }}
          # Le même dossier que HIKE2GPX_HOME, sans « .. », refusé par les actions d'artefact.
          path: ${{ runner.workspace }}/donnees
          include-hidden-files: true
          compression-level: 1        # des bases SQLite déjà denses : vite plutôt que petit
          retention-days: 1

  case:
    needs: [liste, donnees]
    # Une case dont les données ont échoué se fabrique quand même : elle
    # télécharge alors elle-même ce qui lui manque, comme avant le découpage.
    if: ${{ !cancelled() && needs.liste.result == 'success' }}
    name: case ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false              # une case en échec n'arrête pas les autres
      matrix:
        case: ${{ fromJSON(needs.liste.outputs.cases) }}
    env:
      CASE: ${{ matrix.case }}
      GH_TOKEN: ${{ github.token }}
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
      # Lancé depuis ce dépôt (essai), rien n'est publié.
      PUBLIER: ${{ github.repository != 'nico579/hike2gpx' }}
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Reprendre les données de la case
        continue-on-error: true       # absentes : la fabrication les télécharge elle-même
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: donnees-${{ matrix.case }}
          # Le même dossier que HIKE2GPX_HOME, sans « .. », refusé par les actions d'artefact.
          path: ${{ runner.workspace }}/donnees

      - name: Reprendre le lot publié
        run: |
          # Le lot déjà publié de la case, rangé comme bundles le range : un lot à
          # jour (mêmes éditions OSM et BD TOPO) est alors sauté.
          mkdir -p "$RUNNER_TEMP/publie" "$RUNNER_TEMP/lots/$CASE"
          gh release download bundles --repo "$GITHUB_REPOSITORY" --pattern "$CASE.*" \
              --dir "$RUNNER_TEMP/publie" || true
          for f in "$RUNNER_TEMP"/publie/"$CASE".*; do
            [ -e "$f" ] || continue        # aucun fichier : le motif reste tel quel
            mv "$f" "$RUNNER_TEMP/lots/$CASE/${f##*/$CASE.}"
          done
          ls -la "$RUNNER_TEMP/lots/$CASE"

      - name: Reprendre le relief publié
        run: |
          # Le relief d'une case ne change jamais : publié une fois sous le nom
          # relief.<version de BRouter>.<fichier>, il évite les 4 800 tuiles
          # Mapterhorn des fois suivantes.
          BEF=$(python -c "import sys; from hike2gpx import lot, relief; print(relief.fichier_bef(sys.argv[1], lot.boite_case(sys.argv[2])))" "$HIKE2GPX_HOME" "$CASE")
          ACTIF="relief.$(basename "$(dirname "$BEF")").$(basename "$BEF")"
          echo "BEF=$BEF" >> "$GITHUB_ENV"; echo "ACTIF=$ACTIF" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$BEF")"
          if gh release download bundles --repo "$GITHUB_REPOSITORY" --pattern "$ACTIF" --dir "$RUNNER_TEMP"; then
            mv "$RUNNER_TEMP/$ACTIF" "$BEF" && echo "RELIEF_PUBLIE=1" >> "$GITHUB_ENV" && echo "relief repris : $ACTIF"
          fi

      - name: Machine
        run: |
          # Les 4 vCPU du runner ne valent peut-être que 2 cœurs (issue #80).
          nproc; lscpu | grep -E "^(Model name|Thread|Core|Socket|CPU\(s\))"; free -g

      - name: Calculer la case
        # Fusion, RD5 et relief ; les calques suivent sur PARTS machines. Un lot
        # OSM, sans rien à répartir, se fait ici en entier.
        # Deux passages seulement : le calcul est long, et ses vraies erreurs se répètent.
        run: bash .github/reessayer.sh 2 python -m hike2gpx bundles "$CASE" --bulk --stage compute --output "$RUNNER_TEMP/lots"

      - name: Publier le relief
        if: env.RELIEF_PUBLIE != '1' && env.PUBLIER == 'true'
        run: |
          [ -f "$BEF" ] || { echo "pas de relief de case entière à publier"; exit 0; }
          gh release view bundles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create bundles --repo "$GITHUB_REPOSITORY" --title "Lots hors ligne de hike2gpx" \
                 --notes "Lots hors ligne des cases BRouter, refaits chaque semaine. Catalogue : catalog.json." || true
          cp "$BEF" "$RUNNER_TEMP/$ACTIF"
          gh release upload bundles "$RUNNER_TEMP/$ACTIF" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Garder le calcul pour les calques
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Tout le dossier des lots : le calcul (.CASE.etapes, caché), le lot
          # publié repris, et le lot entier d'une case OSM.
          name: etapes-${{ matrix.case }}
          path: ${{ runner.temp }}/lots
          include-hidden-files: true
          retention-days: 1

  # Les calques d'une case, un bloc sur PARTS par machine : près d'une heure et
  # demie d'une traite pour E0_N45. PARTS vaut 4 : la liste « part » ci-dessous
  # et le « --part 4/4 » de la tâche « fin » vont ensemble.
  calques:
    needs: [liste, donnees, case]
    if: ${{ !cancelled() && needs.liste.result == 'success' }}
    name: calques ${{ matrix.case }} ${{ matrix.part }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.liste.outputs.cases) }}
        part: [1, 2, 3, 4]
    env:
      CASE: ${{ matrix.case }}
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Reprendre les données de la case
        continue-on-error: true       # absentes : les calques les téléchargent eux-mêmes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: donnees-${{ matrix.case }}
          path: ${{ runner.workspace }}/donnees

      - name: Reprendre le calcul
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etapes-${{ matrix.case }}
          path: ${{ runner.temp }}/lots

      - name: Calques, part ${{ matrix.part }}/4
        # Un extrait manquant se retélécharge ici aussi (E10_N50, 2026-11-11) : trois passages.
        run: bash .github/reessayer.sh 3 python -m hike2gpx bundles "$CASE" --bulk --stage layers --part ${{ matrix.part }}/4 --output "$RUNNER_TEMP/lots"

      - name: Garder la part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calques-${{ matrix.case }}-${{ matrix.part }}
          path: ${{ runner.temp }}/lots/.${{ matrix.case }}.etapes/calques.${{ matrix.part }}-4.*
          include-hidden-files: true
          if-no-files-found: ignore   # lot OSM ou à jour : pas de part
          retention-days: 1

  fin:
    needs: [liste, calques]
    if: ${{ !cancelled() && needs.liste.result == 'success' }}
    name: fin ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.liste.outputs.cases) }}
    env:
      CASE: ${{ matrix.case }}
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Reprendre le calcul
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: etapes-${{ matrix.case }}
          path: ${{ runner.temp }}/lots

      - name: Reprendre les parts des calques
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: calques-${{ matrix.case }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/lots/.${{ matrix.case }}.etapes

      - name: Assembler le lot
        # Refuse de finir si une part manque : jamais de calques à trous.
        run: bash .github/reessayer.sh 3 python -m hike2gpx bundles "$CASE" --bulk --stage finish --part 4/4 --output "$RUNNER_TEMP/lots"

      - name: Garder le lot pour la publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Le dossier de la case lui-même : la publication retrouve chaque lot
          # par son manifeste, quelle que soit la façon dont les artefacts se
          # déposent (un seul : à plat ; plusieurs : un sous-dossier chacun).
          name: lot-${{ matrix.case }}
          path: ${{ runner.temp }}/lots
          retention-days: 1

  publier:
    needs: [liste, fin]
    # Les cases réussies sont publiées même si une autre a échoué ; jamais
    # depuis ce dépôt, où le workflow ne tourne qu'en essai.
    if: ${{ !cancelled() && github.repository != 'nico579/hike2gpx' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout hike2gpx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nico579/hike2gpx
          ref: ${{ inputs.ref }}

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Rassembler les lots
        run: |
          # Les lots publiés jusqu'ici, puis ceux de cette semaine par-dessus : le
          # catalogue liste toutes les cases, même celles qui ont échoué cette fois.
          mkdir -p "$RUNNER_TEMP/publie" "$RUNNER_TEMP/lots"
          # Les fichiers des lots seulement (E5_N40.…, W5_N45.…), pas les reliefs.
          gh release download bundles --repo "$GITHUB_REPOSITORY" --pattern "[EW]*" --dir "$RUNNER_TEMP/publie" || true
          for f in "$RUNNER_TEMP"/publie/*.*.*; do
            [ -e "$f" ] || continue
            nom=${f##*/}; case=${nom%%.*}
            mkdir -p "$RUNNER_TEMP/lots/$case" && mv "$f" "$RUNNER_TEMP/lots/$case/${nom#$case.}"
          done

      - name: Lots de cette semaine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lot-*
          path: ${{ runner.temp }}/nouveaux

      - name: Catalogue et publication
        run: |
          find "$RUNNER_TEMP/nouveaux" -name manifest.json | while read -r manifeste; do
            d=$(dirname "$manifeste"); case=$(basename "$d")
            echo "lot de la semaine : $case"
            rm -rf "$RUNNER_TEMP/lots/$case" && mv "$d" "$RUNNER_TEMP/lots/$case"
          done
          python -m hike2gpx catalog "$RUNNER_TEMP/lots" --publish-dir "$RUNNER_TEMP/publication"
          gh release view bundles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create bundles --repo "$GITHUB_REPOSITORY" --title "Lots hors ligne de hike2gpx" \
                 --notes "Lots hors ligne des cases BRouter, refaits chaque semaine. Catalogue : catalog.json."
          gh release upload bundles "$RUNNER_TEMP"/publication/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Fraîcheur des lots
        # Un lot qui échoue chaque semaine reste publié, et le téléphone le croit
        # à jour : sans ce contrôle, la dérive passerait inaperçue. Le tableau va
        # dans le résumé du run ; une case demandée absente du catalogue, ou un
        # lot de plus de 14 jours, fait échouer le run, et GitHub prévient.
        env:
          CASES: ${{ join(fromJSON(needs.liste.outputs.cases), ' ') }}
        run: |
          set +e
          python -m hike2gpx freshness "$RUNNER_TEMP/publication/catalog.json" --cells "$CASES" --max-age 14 \
            > "$RUNNER_TEMP/fraicheur.md"
          statut=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/fraicheur.md"
          exit "$statut"
