# Essai, pas production : la tâche « bdtopo » de bundles.yml et la reprise par
# les cases, sur deux cases françaises (W10_N45 : une région ; W5_N45 : cinq),
# sans fabriquer ni publier de lot. La première exécution prépare et garde,
# la seconde (relancée) doit tout reprendre du cache.
name: Essai cache BD TOPO

on:
  push:
    branches: [essai/cache-bdtopo]

permissions:
  contents: read

jobs:
  liste:
    runs-on: ubuntu-24.04
    outputs:
      cases: '["W10_N45", "W5_N45"]'
    steps:
      - run: echo "cases fixes"

  bdtopo:
    needs: liste
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cle: ${{ steps.editions.outputs.cle }}
    env:
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
      CASES: ${{ join(fromJSON(needs.liste.outputs.cases), ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - id: editions
        run: |
          EDITIONS=$(python -c "import sys; from hike2gpx import bdtopo_regions, lot; l = bdtopo_regions.Lecteur(None); r = sorted({x for c in sys.argv[1:] for x in l.regions(*lot.boite_case(c))}); print('_'.join(x + '.' + l.edition(x)['date'] for x in r))" $CASES) || EDITIONS=""
          echo "éditions : ${EDITIONS:-aucune}"
          if [ -n "$EDITIONS" ]; then echo "editions=$EDITIONS" >> "$GITHUB_OUTPUT"; echo "cle=bdtopo-v2-$EDITIONS" >> "$GITHUB_OUTPUT"; fi

      - name: Reprendre les tronçons BD TOPO
        id: cache
        if: steps.editions.outputs.cle != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ steps.editions.outputs.cle }}
          restore-keys: bdtopo-v2-

      - name: Télécharger les régions nouvelles
        if: steps.editions.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          EDITIONS: ${{ steps.editions.outputs.editions }}
        run: |
          time python -c "import logging, sys; logging.basicConfig(level=logging.INFO); from hike2gpx import bdtopo_regions; [bdtopo_regions.geopackage(sys.argv[1], e.split('.')[0]) for e in sys.argv[2].split('_')]" "$HIKE2GPX_HOME" "$EDITIONS"
          du -sh "$HIKE2GPX_HOME/bdtopo-regions"; ls -la "$HIKE2GPX_HOME/bdtopo-regions"

      - name: Garder les tronçons BD TOPO
        if: steps.editions.outputs.cle != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ steps.editions.outputs.cle }}

  case:
    needs: [liste, bdtopo]
    if: ${{ !cancelled() && needs.liste.result == 'success' }}
    name: case ${{ matrix.case }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.liste.outputs.cases) }}
    env:
      HIKE2GPX_HOME: ${{ github.workspace }}/../donnees
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .

      - name: Reprendre les tronçons BD TOPO
        if: needs.bdtopo.outputs.cle != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/donnees/bdtopo-regions
          key: ${{ needs.bdtopo.outputs.cle }}

      - name: Lire le centre de la case (à la place de la fabrication), sans téléchargement
        env:
          CASE: ${{ matrix.case }}
        run: |
          time python -c "import sys; from hike2gpx import bdtopo_regions, lot; bdtopo_regions._telecharger = None; s, o, n, e = lot.boite_case(sys.argv[2]); s, o = s + 2.5, o + 4.5; print(len(bdtopo_regions.Lecteur(sys.argv[1])(s, o, s + 0.05, o + 0.05)), 'tronçons')" "$HIKE2GPX_HOME" "$CASE"
