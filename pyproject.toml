[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hike2gpx"
description = "Tracé de randonnée sur fond IGN qui respecte les clôtures, barrières et interdictions d'OpenStreetMap"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    # Commun des applications de nico579 ; l'extra tray apporte pystray et
    # Pillow pour l'icône de la zone de notification ; 0.6 : enfants, les
    # processus enfants (BRouter, import) meurent avec hike2gpx.
    "nico579-commons[tray]>=0.6.0,<0.7",
    # Moteur de dénivelé de gpx2elev (MNT, protocole 5 m / 20 m / 2 m) ; 0.6.4 : commun 0.6.
    "gpx2elev>=0.6.4,<0.7",
    # Écriture du réseau fusionné OSM + BD TOPO en PBF, le seul format que lit
    # le créateur de tuiles de BRouter (maison.py).
    "osmium>=4.3,<5",
    # Part des chemins IGN déjà couverte par OSM, calculée en bloc (fusion.py) ;
    # même borne basse que gpx2elev, qui l'installe déjà.
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/nico579/hike2gpx"

[project.scripts]
hike2gpx = "hike2gpx.__main__:main"

[tool.setuptools]
packages = ["hike2gpx", "hike2gpx.assets", "hike2gpx.assets.web"]

[tool.setuptools.package-data]
"hike2gpx.assets" = ["*.png", "*.ico"]
"hike2gpx.assets.web" = ["*.html", "*.js", "*.css", "leaflet/*"]

[tool.setuptools.dynamic]
version = {attr = "hike2gpx.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: avec le vrai BRouter, sauté sans ses données (HIKE2GPX_HOME)"]
