name: CI

# Les tests à chaque poussée et chaque PR, sur les trois systèmes, comme les
# autres applications (vague 3 de l'alignement, 2026-10-19). Jusqu'ici ils ne
# tournaient qu'à la main : un test instable a atteint main sans être vu, et
# les tests du damier et des calques en parallèle, qui exigent Linux (fork),
# ne tournaient que sur une VM.
# Java et Node, déjà sur les exécuteurs GitHub, ouvrent l'auto-test et les
# tests de la page ; sans BRouter installé, les tests d'intégration se sautent.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer hike2gpx
        run: |
          python -m pip install --quiet --require-hashes -r requirements.txt
          python -m pip install --quiet --no-deps -e .
          python -m pip install --quiet pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests/
